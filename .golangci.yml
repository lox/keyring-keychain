version: "2"

linters:
  enable:
    - bodyclose
    - contextcheck
    - durationcheck
    - dupl
    - errchkjson
    - errname
    - exhaustive
    - gocritic
    - makezero
    - misspell
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - prealloc
    - revive
    # - rowserrcheck
    - thelper
    - tparallel
    - unconvert
    - unparam
    # - wastedassign
    - whitespace
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      # gocritic misfires on cgo call expansions in the Security framework
      # bindings (dupSubExpr on generated code).
      - path: internal/sec/
        linters:
          - gocritic

formatters:
  enable:
    - gofmt
    - goimports
